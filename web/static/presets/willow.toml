# Willow Tree Species Configuration
# A graceful tree with drooping branches

[species]
name = "Weeping Willow"
scientific_name = "Salix babylonica"

[trunk]
height = { min = 6.0, max = 12.0 }
radius_base = { min = 0.5, max = 0.9 }
radius_top_ratio = 0.35
taper_curve = "exponential"
segments = 12
lean_enabled = true
lean_amount = { min = 0.0, max = 0.1 }

[branches]
# Primary branches spread wide
primary_count = { min = 5, max = 8 }
primary_angle = { min = 50.0, max = 80.0 }
primary_length_ratio = { min = 0.6, max = 0.9 }
primary_start_height = 0.35

# Secondary branches
secondary_count = { min = 3, max = 5 }
secondary_angle = { min = 40.0, max = 70.0 }
secondary_length_ratio = { min = 0.5, max = 0.7 }

# Drooping tertiary branches (whips)
tertiary_count = { min = 8, max = 15 }
tertiary_angle = { min = 60.0, max = 120.0 }
tertiary_length_ratio = { min = 0.6, max = 1.2 }
tertiary_droop = 0.9

[branching]
recursion_depth = 4
length_decay = 0.8
radius_decay = 0.5
angle_variance = 20.0
heliotropism = 0.1
gravitropism_override = 0.7
weeping_enabled = true
weeping_strength = 0.85

[leaves]
density = 0.7
size = { min = 0.02, max = 0.04 }
shape = "lanceolate"
color = [0.3, 0.55, 0.2]
droop_follow = true

[bark]
color = [0.4, 0.35, 0.25]
roughness = 0.6
pattern = "ridged"

[growth]
phototropism = 0.2
gravitropism = 0.5
random_variation = 0.25

[wind]
enabled = true
sensitivity = 0.8
sway_frequency = 0.5
cascade_effect = true

[lod]
lod0_segments = 12
lod1_segments = 8
lod2_segments = 4
whip_simplify_distance = 25.0
