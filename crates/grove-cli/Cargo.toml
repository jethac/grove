[package]
name = "grove-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the grove procedural tree generator"

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
grove-core = { path = "../grove-core" }
